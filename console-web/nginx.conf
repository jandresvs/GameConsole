# nginx de GameConsole: entrega la página y reenvía /api/... a los servicios.
#
# El navegador habla con un solo origen, así que no hacen falta permisos CORS
# en GameStats ni en Prolog (el mismo criterio que usa el panel de GameStats).
#
#   /api/ingest/...   → ingest:8080    (GameStats, Go)     GET y POST
#   /api/analyzer/... → analyzer:8081  (GameStats, Scala)  solo GET
#   /api/prolog/...   → prolog:8082    (SWI-Prolog)        GET y POST

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con "set $upstream" nginx resuelve el nombre en cada
    # petición: arranca aunque un servicio esté caído y lo reencuentra si se reinicia.
    resolver 127.0.0.11 valid=10s ipv6=off;

    client_max_body_size 10m;     # el mismo límite que POST /events del ingest
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Connection "";

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ingest/ {
        set $upstream http://ingest:8080;
        rewrite ^/api/ingest/(.*)$ /$1 break;
        proxy_pass $upstream;
        add_header Cache-Control "no-store" always;
        error_page 502 504 = @unavailable;
    }

    location /api/analyzer/ {
        # Solo lectura: los eventos entran siempre por el ingest, nunca directo a Scala.
        limit_except GET { deny all; }
        set $upstream http://analyzer:8081;
        rewrite ^/api/analyzer/(.*)$ /$1 break;
        proxy_pass $upstream;
        add_header Cache-Control "no-store" always;
        error_page 502 504 = @unavailable;
    }

    location /api/prolog/ {
        set $upstream http://prolog:8082;
        rewrite ^/api/prolog/(.*)$ /$1 break;
        proxy_pass $upstream;
        add_header Cache-Control "no-store" always;
        error_page 502 504 = @unavailable;
    }

    # Cualquier otra ruta bajo /api no existe.
    location /api/ {
        default_type application/json;
        return 404 '{"error":"ruta de API desconocida"}';
    }

    location @unavailable {
        default_type application/json;
        add_header Cache-Control "no-store" always;
        return 502 '{"error":"servicio no disponible"}';
    }

    # Archivos de la aplicación (generados por Vite). Los de /assets llevan un
    # hash en el nombre, así que se pueden guardar en caché sin riesgo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
