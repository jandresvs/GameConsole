# Integración continua: en cada push y pull request
#   1. compila la consola (TypeScript + Vite) y corre sus pruebas;
#   2. corre las pruebas de Prolog;
#   3. levanta el sistema completo con Docker Compose y corre la prueba de humo
#      (scripts/smoke-test.sh): consola, Prolog y GameStats trabajando juntos.
#
# La publicación de imágenes está en release.yml.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  web:
    name: Consola (TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console-web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console-web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build     # tsc --noEmit (tipos) + vite build

  prolog:
    name: Servicio Prolog (pruebas)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pruebas de route.pl (incluye comparación con fuerza bruta)
        run: |
          docker run --rm -v "$PWD/ai-prolog:/app" -w /app swipl:stable \
            swipl -g run_tests -t halt test_route.pl

  system:
    name: Sistema completo (prueba de humo)
    runs-on: ubuntu-latest
    needs: [web, prolog]
    steps:
      - uses: actions/checkout@v4

      - name: Construir y levantar los cuatro servicios
        # --wait espera a que los healthchecks de todos digan "healthy".
        # GameStats se descarga de ghcr.io (GAMESTATS_VERSION, v1.1 por defecto).
        run: docker compose up -d --build --wait

      - name: Prueba de humo
        run: bash scripts/smoke-test.sh

      - name: Mostrar logs si algo falló
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down
